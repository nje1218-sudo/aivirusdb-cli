name: Publish to npm

# Publishes when a GitHub Release is published. The release tag must be
# v<package.json version>, e.g. v0.1.0.
#
# Authentication: npm tries Trusted Publishing (OIDC) first. npmjs.com trusts
# this repository + workflow file + the `npm` environment. If the OIDC
# exchange is refused, npm falls back to the NPM_TOKEN secret of the `npm`
# environment (temporary, Owner decision 2026-11-19: remove it once a publish
# log shows the OIDC exchange succeeding). Provenance is attached automatically.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # OIDC token for npm Trusted Publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # No registry-url: that writes an .npmrc with a placeholder
          # NODE_AUTH_TOKEN, which npm can fall back to instead of OIDC.
      - name: Tag must match package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json $version"
            exit 1
          fi
      - name: npm CLI new enough for Trusted Publishing (>= 11.5.1)
        run: |
          set -euo pipefail
          npm install -g npm@11
          npm --version
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # verbose logging shows whether the OIDC exchange or the token was used
        run: |
          set -euo pipefail
          npmrc="$RUNNER_TEMP/publish.npmrc"
          # The file holds a reference to the variable, not the token itself.
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$npmrc"
          NPM_CONFIG_USERCONFIG="$npmrc" npm publish --access public --provenance --loglevel verbose
