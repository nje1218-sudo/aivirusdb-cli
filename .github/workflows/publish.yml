name: Publish to npm

# Publishes when a GitHub Release is published. The release tag must be
# v<package.json version>, e.g. v0.1.0.
#
# Staged publishing (Owner decision 2026-11-19): CI runs `npm stage publish`,
# which places the version in the registry without making it public. A
# maintainer then approves it with 2FA (`npm stage list` + `npm stage approve
# <id>`), and only then is it published. CI therefore never holds a credential
# that can publish on its own.
#
# Authentication: npm tries Trusted Publishing (OIDC) first. That currently
# fails for this repo (npm/cli#9969: repos created after 2026-07-15 send an
# immutable OIDC subject npm does not match yet), so npm falls back to the
# NPM_TOKEN secret of the `npm` environment: a granular token WITHOUT bypass
# 2FA, which can stage but not publish. Provenance is attached.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # OIDC token for npm Trusted Publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # No registry-url: that writes an .npmrc with a placeholder
          # NODE_AUTH_TOKEN, which npm can fall back to instead of OIDC.
      - name: Tag must match package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json $version"
            exit 1
          fi
      - name: npm CLI new enough for staged publishing (>= 11.15.0)
        run: |
          set -euo pipefail
          npm install -g npm@11
          npm --version
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Stage for approval
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # verbose logging shows whether the OIDC exchange or the token was used
        run: |
          set -euo pipefail
          npmrc="$RUNNER_TEMP/publish.npmrc"
          # The file holds a reference to the variable, not the token itself.
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$npmrc"
          NPM_CONFIG_USERCONFIG="$npmrc" npm stage publish --access public --provenance --loglevel verbose
      - name: Next step for the maintainer
        run: |
          {
            echo "## Staged, not yet published"
            echo ""
            echo "Approve with 2FA to publish \`$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')\`:"
            echo ""
            echo '```bash'
            echo "npm stage list aivirusdb"
            echo "npm stage approve <stage-id>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
