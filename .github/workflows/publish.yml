name: Publish to npm

# Publishes when a GitHub Release is published. The release tag must be
# v<package.json version>, e.g. v0.1.0.
#
# Authentication is npm Trusted Publishing (OIDC): npmjs.com trusts this
# repository + workflow file + the `npm` environment, so no npm token is
# stored in GitHub. Provenance is attached automatically.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # OIDC token for npm Trusted Publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Tag must match package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json $version"
            exit 1
          fi
      - name: npm CLI new enough for Trusted Publishing (>= 11.5.1)
        run: |
          set -euo pipefail
          npm install -g npm@11
          npm --version
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Publish
        run: npm publish --access public
